<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temp Chat - Admin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="admin-page">

        <!-- LOGIN -->
        <section id="loginSection" class="admin-card">

            <h1>Temp Chat</h1>

            <p class="admin-subtitle">
                Administrator Login
            </p>

            <form id="loginForm">

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Admin email"
                    autocomplete="email"
                    required
                >

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="primary-btn">
                    Login
                </button>

            </form>

            <p id="loginError" class="error"></p>

        </section>


        <!-- ADMIN PANEL -->
        <section id="adminSection" class="admin-dashboard hidden">

            <header class="admin-header">

                <div>
                    <h1>Admin Panel</h1>

                    <p>
                        Active temporary chats
                    </p>
                </div>

                <button id="logoutButton" class="secondary-btn">
                    Logout
                </button>

            </header>


            <div class="admin-notice">

                <strong>Administrator Access</strong>

                <p>
                    You are viewing temporary chat sessions.
                    Messages may be accessed by the site administrator
                    for moderation and technical purposes.
                </p>

            </div>


            <div class="stats">

                <div class="stat-card">

                    <span>Active Chats</span>

                    <strong id="roomCount">
                        0
                    </strong>

                </div>

            </div>


            <div id="roomsContainer">

                <p class="empty-admin">
                    Loading chats...
                </p>

            </div>

        </section>

    </main>


    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        }
        from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


        import {
            getDatabase,
            ref,
            onValue
        }
        from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


        // =========================
        // FIREBASE CONFIG
        // =========================

        const firebaseConfig = {

            apiKey:
                "AIzaSyCBmRCHsecRLftZ52_w02sbRpFPEQwOcxU",

            authDomain:
                "temp-chat-b15be.firebaseapp.com",

            databaseURL:
                "https://temp-chat-b15be-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId:
                "temp-chat-b15be",

            storageBucket:
                "temp-chat-b15be.firebasestorage.app",

            messagingSenderId:
                "1086824753488",

            appId:
                "1:1086824753488:web:e801b6e773ceb94e076455"

        };


        // =========================
        // INITIALIZE
        // =========================

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getDatabase(app);


        // =========================
        // ELEMENTS
        // =========================

        const loginSection =
            document.getElementById("loginSection");

        const adminSection =
            document.getElementById("adminSection");

        const loginForm =
            document.getElementById("loginForm");

        const loginError =
            document.getElementById("loginError");

        const logoutButton =
            document.getElementById("logoutButton");

        const roomsContainer =
            document.getElementById("roomsContainer");

        const roomCount =
            document.getElementById("roomCount");


        // =========================
        // ADMIN EMAIL
        // =========================

        const ADMIN_EMAIL =
            "t12pathak@gmail.com";


        // =========================
        // LOGIN
        // =========================

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                loginError.textContent = "";

                const email =
                    document
                        .getElementById("adminEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("adminPassword")
                        .value;


                if (email !== ADMIN_EMAIL) {

                    loginError.textContent =
                        "Administrator account required.";

                    return;

                }


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                } catch (error) {

                    console.error(
                        "ADMIN LOGIN ERROR:",
                        error
                    );

                    loginError.textContent =
                        "Invalid email or password.";

                }

            }
        );


        // =========================
        // AUTH STATE
        // =========================

        onAuthStateChanged(
            auth,
            (user) => {

                if (
                    user &&
                    user.email === ADMIN_EMAIL
                ) {

                    loginSection.classList.add(
                        "hidden"
                    );

                    adminSection.classList.remove(
                        "hidden"
                    );

                    loadRooms();

                } else {

                    loginSection.classList.remove(
                        "hidden"
                    );

                    adminSection.classList.add(
                        "hidden"
                    );

                }

            }
        );


        // =========================
        // LOAD ROOMS
        // =========================

        function loadRooms() {

            const roomsRef =
                ref(db, "rooms");


            onValue(
                roomsRef,
                (snapshot) => {

                    const rooms =
                        snapshot.val() || {};

                    const roomCodes =
                        Object.keys(rooms);

                    roomCount.textContent =
                        roomCodes.length;


                    if (roomCodes.length === 0) {

                        roomsContainer.innerHTML =
                            `
                            <p class="empty-admin">
                                No active chats.
                            </p>
                            `;

                        return;

                    }


                    roomsContainer.innerHTML = "";


                    roomCodes
                        .reverse()
                        .forEach(
                            (roomCode) => {

                                createRoomCard(
                                    roomCode,
                                    rooms[roomCode]
                                );

                            }
                        );

                },

                (error) => {

                    console.error(
                        "ROOM LOAD ERROR:",
                        error
                    );

                    roomsContainer.innerHTML =
                        `
                        <p class="error">
                            Could not load chats.
                        </p>
                        `;

                }
            );

        }


        // =========================
        // CREATE ROOM CARD
        // =========================

        function createRoomCard(
            roomCode,
            room
        ) {

            const users =
                room.users || {};

            const messages =
                room.messages || {};

            const userCount =
                Object.keys(users).length;

            const messageCount =
                Object.keys(messages).length;


            const createdTime =
                room.createdAt
                    ? new Date(
                        room.createdAt
                    ).toLocaleString()
                    : "Unknown";


            const card =
                document.createElement("div");

            card.className =
                "admin-room";


            card.innerHTML =
                `
                <div class="room-summary">

                    <div>

                        <h2>${roomCode}</h2>

                        <p>
                            Created: ${createdTime}
                        </p>

                    </div>

                    <div class="room-stats">

                        <span>
                            ${userCount}/2 users
                        </span>

                        <span>
                            ${messageCount} messages
                        </span>

                    </div>

                </div>

                <div class="admin-messages">

                    ${
                        messageCount === 0
                            ? `
                            <p class="empty-admin">
                                No messages yet.
                            </p>
                            `
                            : ""
                    }

                </div>
                `;


            const messageContainer =
                card.querySelector(
                    ".admin-messages"
                );


            Object.keys(messages)
                .forEach(
                    (messageId) => {

                        const message =
                            messages[messageId];

                        const messageElement =
                            document.createElement(
                                "div"
                            );

                        messageElement.className =
                            "admin-message";


                        const time =
                            message.createdAt
                                ? new Date(
                                    message.createdAt
                                ).toLocaleTimeString()
                                : "";


                        messageElement.innerHTML =
                            `
                            <div class="admin-message-meta">

                                <span>
                                    User:
                                    ${escapeHTML(
                                        message.userId || "Unknown"
                                    )}
                                </span>

                                <span>
                                    ${time}
                                </span>

                            </div>

                            <div class="admin-message-text">

                                ${escapeHTML(
                                    message.text || ""
                                )}

                            </div>
                            `;


                        messageContainer.appendChild(
                            messageElement
                        );

                    }
                );


            roomsContainer.appendChild(
                card
            );

        }


        // =========================
        // ESCAPE HTML
        // =========================

        function escapeHTML(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }


        // =========================
        // LOGOUT
        // =========================

        logoutButton.addEventListener(
            "click",
            async () => {

                await signOut(auth);

            }
        );

    </script>

</body>

</html>

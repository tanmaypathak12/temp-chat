<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Temp Chat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="chat-page">

        <div class="chat-container">


            <!-- HEADER -->

            <header class="chat-header">

                <div>

                    <h1>Temp Chat</h1>

                    <p class="room-info">
                        Room:
                        <strong id="roomCode">
                            ------
                        </strong>
                    </p>

                </div>


                <div class="header-actions">

                    <button
                        id="copyCode"
                        class="small-btn"
                    >
                        Copy Code
                    </button>

                    <button
                        id="leaveChat"
                        class="leave-btn"
                    >
                        Leave
                    </button>

                </div>

            </header>



            <!-- STATUS -->

            <div class="status-bar">

                <span
                    id="connectionStatus"
                    class="status-dot"
                ></span>

                <span id="statusText">
                    Connecting...
                </span>

            </div>



            <!-- MESSAGES -->

            <section
                id="messages"
                class="messages"
            >

                <div
                    id="emptyMessage"
                    class="empty-message"
                >
                    No messages yet.
                    <br>
                    Say hello.
                </div>

            </section>



            <!-- INPUT -->

            <form
                id="messageForm"
                class="message-form"
            >

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message..."
                    autocomplete="off"
                    maxlength="1000"
                >

                <button
                    type="submit"
                    class="send-btn"
                >
                    Send
                </button>

            </form>


        </div>

    </main>



    <script type="module">


        // ==========================================
        // FIREBASE IMPORTS
        // ==========================================

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


        import {
            getAuth,
            signInAnonymously
        }
        from
        "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


        import {
            getDatabase,
            ref,
            set,
            get,
            push,
            onChildAdded,
            onValue,
            onDisconnect,
            remove
        }
        from
        "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";



        // ==========================================
        // FIREBASE CONFIG
        // ==========================================

        const firebaseConfig = {

            apiKey:
                "AIzaSyCBmRCHsecRLftZ52_w02sbRpFPEQwOcxU",

            authDomain:
                "temp-chat-b15be.firebaseapp.com",

            databaseURL:
                "https://temp-chat-b15be-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId:
                "temp-chat-b15be",

            storageBucket:
                "temp-chat-b15be.firebasestorage.app",

            messagingSenderId:
                "1086824753488",

            appId:
                "1:1086824753488:web:e801b6e773ceb94e076455"

        };



        // ==========================================
        // INITIALIZE FIREBASE
        // ==========================================

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getDatabase(app);



        // ==========================================
        // GET ROOM CODE
        // ==========================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const roomCode =
            urlParams.get("room")
                ?.trim()
                .toUpperCase();



        // ==========================================
        // PAGE ELEMENTS
        // ==========================================

        const roomCodeElement =
            document.getElementById(
                "roomCode"
            );


        const messagesElement =
            document.getElementById(
                "messages"
            );


        const emptyMessage =
            document.getElementById(
                "emptyMessage"
            );


        const messageForm =
            document.getElementById(
                "messageForm"
            );


        const messageInput =
            document.getElementById(
                "messageInput"
            );


        const copyCodeButton =
            document.getElementById(
                "copyCode"
            );


        const leaveButton =
            document.getElementById(
                "leaveChat"
            );


        const statusText =
            document.getElementById(
                "statusText"
            );


        const statusDot =
            document.getElementById(
                "connectionStatus"
            );



        // ==========================================
        // CHECK ROOM CODE
        // ==========================================

        if (!roomCode || roomCode.length !== 6) {

            alert(
                "Invalid chat room."
            );

            window.location.href =
                "index.html";

        }


        roomCodeElement.textContent =
            roomCode;



        // ==========================================
        // VARIABLES
        // ==========================================

        let currentUser = null;

        let userRef = null;

        let roomRef = null;

        let messagesRef = null;

        let leaving = false;



        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHTML(text) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent = text;

            return div.innerHTML;

        }



        // ==========================================
        // SHOW STATUS
        // ==========================================

        function setStatus(
            text,
            online = true
        ) {

            statusText.textContent =
                text;


            if (online) {

                statusDot.classList.add(
                    "online"
                );

            } else {

                statusDot.classList.remove(
                    "online"
                );

            }

        }



        // ==========================================
        // INITIALIZE CHAT
        // ==========================================

        async function initializeChat() {

            try {


                setStatus(
                    "Connecting...",
                    false
                );


                // Anonymous login

                const userCredential =
                    await signInAnonymously(
                        auth
                    );


                currentUser =
                    userCredential.user;


                // Room reference

                roomRef =
                    ref(
                        db,
                        "rooms/" +
                        roomCode
                    );


                // User reference

                userRef =
                    ref(
                        db,
                        "rooms/" +
                        roomCode +
                        "/users/" +
                        currentUser.uid
                    );


                // Messages reference

                messagesRef =
                    ref(
                        db,
                        "rooms/" +
                        roomCode +
                        "/messages"
                    );



                // ==================================
                // CHECK ROOM
                // ==================================

                const roomSnapshot =
                    await get(roomRef);


                if (!roomSnapshot.exists()) {

                    alert(
                        "This chat no longer exists."
                    );

                    window.location.href =
                        "index.html";

                    return;

                }



                // ==================================
                // CHECK USER COUNT
                // ==================================

                const roomData =
                    roomSnapshot.val();


                const users =
                    roomData.users || {};


                const userIds =
                    Object.keys(users);


                if (
                    !users[currentUser.uid] &&
                    userIds.length >= 2
                ) {

                    alert(
                        "This chat is already full."
                    );

                    window.location.href =
                        "index.html";

                    return;

                }



                // ==================================
                // ADD USER
                // ==================================

                await set(
                    userRef,
                    true
                );



                // ==================================
                // AUTO REMOVE USER ON DISCONNECT
                // ==================================

                await onDisconnect(
                    userRef
                ).remove();



                // ==================================
                // ONLINE STATUS
                // ==================================

                setStatus(
                    "Connected",
                    true
                );



                // ==================================
                // LOAD EXISTING MESSAGES
                // ==================================

                onChildAdded(
                    messagesRef,
                    (snapshot) => {

                        displayMessage(
                            snapshot.val()
                        );

                    }
                );



                // ==================================
                // WATCH USERS
                // ==================================

                onValue(
                    ref(
                        db,
                        "rooms/" +
                        roomCode +
                        "/users"
                    ),
                    async (snapshot) => {

                        const users =
                            snapshot.val() || {};

                        const count =
                            Object.keys(
                                users
                            ).length;


                        if (count === 0) {

                            if (!leaving) {

                                try {

                                    await remove(
                                        roomRef
                                    );

                                } catch (error) {

                                    console.error(
                                        error
                                    );

                                }

                            }

                        }

                    }
                );



                // ==================================
                // SAVE SESSION
                // ==================================

                sessionStorage.setItem(
                    "tempChatUser",
                    currentUser.uid
                );


                sessionStorage.setItem(
                    "tempChatRoom",
                    roomCode
                );



                // Focus input

                messageInput.focus();


            } catch (error) {

                console.error(
                    "CHAT INITIALIZATION ERROR:",
                    error
                );


                setStatus(
                    "Connection failed",
                    false
                );


                alert(
                    "Could not open this chat."
                );

                window.location.href =
                    "index.html";

            }

        }



        // ==========================================
        // DISPLAY MESSAGE
        // ==========================================

        function displayMessage(
            message
        ) {

            if (!message) {
                return;
            }


            // Remove empty message

            if (
                emptyMessage &&
                emptyMessage.parentNode
            ) {

                emptyMessage.remove();

            }



            const messageDiv =
                document.createElement(
                    "div"
                );


            messageDiv.className =
                "message";



            // Own message

            if (
                currentUser &&
                message.userId ===
                currentUser.uid
            ) {

                messageDiv.classList.add(
                    "my-message"
                );

            } else {

                messageDiv.classList.add(
                    "other-message"
                );

            }



            const text =
                escapeHTML(
                    message.text || ""
                );


            messageDiv.innerHTML =
                `
                <div class="message-text">
                    ${text}
                </div>

                <div class="message-time">
                    ${formatTime(message.createdAt)}
                </div>
                `;



            messagesElement.appendChild(
                messageDiv
            );


            // Scroll to bottom

            messagesElement.scrollTop =
                messagesElement.scrollHeight;

        }



        // ==========================================
        // FORMAT TIME
        // ==========================================

        function formatTime(
            timestamp
        ) {

            if (!timestamp) {

                return "";

            }


            const date =
                new Date(timestamp);


            return date.toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }



        // ==========================================
        // SEND MESSAGE
        // ==========================================

        messageForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const text =
                    messageInput.value.trim();


                if (!text) {

                    return;

                }


                if (!currentUser) {

                    return;

                }


                try {


                    const newMessage =
                        push(
                            messagesRef
                        );


                    await set(
                        newMessage,
                        {

                            userId:
                                currentUser.uid,

                            text:
                                text,

                            createdAt:
                                Date.now()

                        }
                    );


                    messageInput.value = "";

                    messageInput.focus();


                } catch (error) {

                    console.error(
                        "SEND MESSAGE ERROR:",
                        error
                    );


                    alert(
                        "Message could not be sent."
                    );

                }

            }
        );



        // ==========================================
        // COPY ROOM CODE
        // ==========================================

        copyCodeButton.addEventListener(
            "click",
            async () => {

                try {

                    await navigator.clipboard.writeText(
                        roomCode
                    );


                    const originalText =
                        copyCodeButton.textContent;


                    copyCodeButton.textContent =
                        "Copied!";


                    setTimeout(
                        () => {

                            copyCodeButton.textContent =
                                originalText;

                        },
                        1500
                    );


                } catch (error) {

                    console.error(
                        error
                    );

                }

            }
        );



        // ==========================================
        // LEAVE CHAT
        // ==========================================

        leaveButton.addEventListener(
            "click",
            async () => {

                if (leaving) {

                    return;

                }


                const confirmed =
                    confirm(
                        "Leave this chat?"
                    );


                if (!confirmed) {

                    return;

                }


                leaving = true;


                try {

                    if (userRef) {

                        await remove(
                            userRef
                        );

                    }


                    sessionStorage.removeItem(
                        "tempChatUser"
                    );


                    sessionStorage.removeItem(
                        "tempChatRoom"
                    );


                    window.location.href =
                        "index.html";


                } catch (error) {

                    console.error(
                        "LEAVE ERROR:",
                        error
                    );


                    window.location.href =
                        "index.html";

                }

            }
        );



        // ==========================================
        // START
        // ==========================================

        initializeChat();

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Temp Chat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="chat-page">

        <div class="chat-container">

            <!-- HEADER -->

            <header class="chat-header">

                <div>

                    <h1>Temp Chat</h1>

                    <p class="room-info">
                        Room:
                        <strong id="roomCode">
                            ------
                        </strong>
                    </p>

                </div>


                <div class="header-actions">

                    <button
                        id="copyCode"
                        class="small-btn"
                    >
                        Copy Code
                    </button>

                    <button
                        id="leaveChat"
                        class="leave-btn"
                    >
                        Leave
                    </button>

                </div>

            </header>


            <!-- STATUS -->

            <div class="status-bar">

                <span
                    id="connectionStatus"
                    class="status-dot"
                ></span>

                <span id="statusText">
                    Connecting...
                </span>

            </div>


            <!-- MESSAGES -->

            <section
                id="messages"
                class="messages"
            >

                <div
                    id="emptyMessage"
                    class="empty-message"
                >
                    No messages yet.
                    <br>
                    Say hello.
                </div>

            </section>


            <!-- INPUT -->

            <form
                id="messageForm"
                class="message-form"
            >

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message..."
                    autocomplete="off"
                    maxlength="1000"
                >

                <button
                    type="submit"
                    class="send-btn"
                >
                    Send
                </button>

            </form>

        </div>

    </main>


    <script type="module">

        // ==========================================
        // FIREBASE IMPORTS
        // ==========================================

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


        import {
            getAuth,
            signInAnonymously
        }
        from
        "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


        import {
            getDatabase,
            ref,
            set,
            get,
            push,
            onChildAdded,
            onValue,
            remove
        }
        from
        "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


        // ==========================================
        // FIREBASE CONFIG
        // ==========================================

        const firebaseConfig = {

            apiKey:
                "AIzaSyCBmRCHsecRLftZ52_w02sbRpFPEQwOcxU",

            authDomain:
                "temp-chat-b15be.firebaseapp.com",

            databaseURL:
                "https://temp-chat-b15be-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId:
                "temp-chat-b15be",

            storageBucket:
                "temp-chat-b15be.firebasestorage.app",

            messagingSenderId:
                "1086824753488",

            appId:
                "1:1086824753488:web:e801b6e773ceb94e076455"

        };


        // ==========================================
        // INITIALIZE FIREBASE
        // ==========================================

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getDatabase(app);


        // ==========================================
        // ROOM CODE
        // ==========================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const roomCode =
            urlParams.get("room")
                ?.trim()
                .toUpperCase();


        // ==========================================
        // ELEMENTS
        // ==========================================

        const roomCodeElement =
            document.getElementById(
                "roomCode"
            );

        const messagesElement =
            document.getElementById(
                "messages"
            );

        const emptyMessage =
            document.getElementById(
                "emptyMessage"
            );

        const messageForm =
            document.getElementById(
                "messageForm"
            );

        const messageInput =
            document.getElementById(
                "messageInput"
            );

        const copyCodeButton =
            document.getElementById(
                "copyCode"
            );

        const leaveButton =
            document.getElementById(
                "leaveChat"
            );

        const statusText =
            document.getElementById(
                "statusText"
            );

        const statusDot =
            document.getElementById(
                "connectionStatus"
            );


        // ==========================================
        // CHECK ROOM
        // ==========================================

        if (
            !roomCode ||
            roomCode.length !== 6
        ) {

            alert(
                "Invalid chat room."
            );

            window.location.href =
                "index.html";

        }


        roomCodeElement.textContent =
            roomCode;


        // ==========================================
        // VARIABLES
        // ==========================================

        let currentUser = null;

        let userRef = null;

        let roomRef = null;

        let messagesRef = null;

        let leaving = false;


        // ==========================================
        // STATUS
        // ==========================================

        function setStatus(
            text,
            online = true
        ) {

            statusText.textContent =
                text;


            if (online) {

                statusDot.classList.add(
                    "online"
                );

            } else {

                statusDot.classList.remove(
                    "online"
                );

            }

        }


        // ==========================================
        // FORMAT TIME
        // ==========================================

        function formatTime(
            timestamp
        ) {

            if (!timestamp) {
                return "";
            }


            const date =
                new Date(timestamp);


            return date.toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        // ==========================================
        // DISPLAY MESSAGE
        // ==========================================

        function displayMessage(
            message
        ) {

            if (!message) {
                return;
            }


            // Remove empty message

            if (
                emptyMessage &&
                emptyMessage.parentNode
            ) {

                emptyMessage.remove();

            }


            // Message wrapper

            const messageDiv =
                document.createElement(
                    "div"
                );


            messageDiv.classList.add(
                "message"
            );


            // Check sender

            if (
                currentUser &&
                message.userId ===
                currentUser.uid
            ) {

                messageDiv.classList.add(
                    "my-message"
                );

            } else {

                messageDiv.classList.add(
                    "other-message"
                );

            }


            // Bubble

            const bubble =
                document.createElement(
                    "div"
                );

            bubble.classList.add(
                "message-bubble"
            );


            // Text

            const messageText =
                document.createElement(
                    "div"
                );

            messageText.classList.add(
                "message-text"
            );

            messageText.textContent =
                message.text || "";


            // Time

            const messageTime =
                document.createElement(
                    "span"
                );

            messageTime.classList.add(
                "message-time"
            );

            messageTime.textContent =
                formatTime(
                    message.createdAt
                );


            // Build

            bubble.appendChild(
                messageText
            );

            bubble.appendChild(
                messageTime
            );

            messageDiv.appendChild(
                bubble
            );

            messagesElement.appendChild(
                messageDiv
            );


            // Scroll

            messagesElement.scrollTop =
                messagesElement.scrollHeight;

        }


        // ==========================================
        // INITIALIZE CHAT
        // ==========================================

        async function initializeChat() {

            try {

                setStatus(
                    "Connecting...",
                    false
                );


                // Anonymous authentication

                const userCredential =
                    await signInAnonymously(
                        auth
                    );


                currentUser =
                    userCredential.user;


                console.log(
                    "CURRENT USER UID:",
                    currentUser.uid
                );


                // ==================================
                // REFERENCES
                // ==================================

                roomRef =
                    ref(
                        db,
                        "rooms/" +
                        roomCode
                    );


                userRef =
                    ref(
                        db,
                        "rooms/" +
                        roomCode +
                        "/users/" +
                        currentUser.uid
                    );


                messagesRef =
                    ref(
                        db,
                        "rooms/" +
                        roomCode +
                        "/messages"
                    );


                // ==================================
                // CHECK ROOM
                // ==================================

                const roomSnapshot =
                    await get(roomRef);


                if (!roomSnapshot.exists()) {

                    alert(
                        "This chat no longer exists."
                    );

                    window.location.href =
                        "index.html";

                    return;

                }


                // ==================================
                // CHECK USERS
                // ==================================

                const roomData =
                    roomSnapshot.val();


                const users =
                    roomData.users || {};


                const userIds =
                    Object.keys(users);


                /*
                 * If this user is already in the room,
                 * allow them back in.
                 *
                 * This is important for the creator
                 * after refresh/tab switching.
                 */

                if (
                    !users[currentUser.uid] &&
                    userIds.length >= 2
                ) {

                    alert(
                        "This chat is already full."
                    );

                    window.location.href =
                        "index.html";

                    return;

                }


                // ==================================
                // ADD / RESTORE USER
                // ==================================

                await set(
                    userRef,
                    true
                );


                /*
                 * IMPORTANT:
                 *
                 * We intentionally DO NOT use:
                 *
                 * onDisconnect(userRef).remove()
                 *
                 * because that was causing the creator's
                 * membership to disappear while the page
                 * was still being used.
                 */


                // ==================================
                // CONNECTED
                // ==================================

                setStatus(
                    "Connected",
                    true
                );


                // ==================================
                // LOAD MESSAGES
                // ==================================

                onChildAdded(
                    messagesRef,
                    (snapshot) => {

                        displayMessage(
                            snapshot.val()
                        );

                    }
                );


                // ==================================
                // WATCH USER COUNT
                // ==================================

                onValue(
                    ref(
                        db,
                        "rooms/" +
                        roomCode +
                        "/users"
                    ),

                    (snapshot) => {

                        const users =
                            snapshot.val() || {};


                        const count =
                            Object.keys(
                                users
                            ).length;


                        if (count === 1) {

                            setStatus(
                                "Connected • 1/2",
                                true
                            );

                        }

                        else if (count >= 2) {

                            setStatus(
                                "Connected • 2/2",
                                true
                            );

                        }

                        else {

                            setStatus(
                                "Connected",
                                true
                            );

                        }

                    }
                );


                // ==================================
                // SAVE SESSION
                // ==================================

                sessionStorage.setItem(
                    "tempChatUser",
                    currentUser.uid
                );

                sessionStorage.setItem(
                    "tempChatRoom",
                    roomCode
                );


                messageInput.focus();


            } catch (error) {

                console.error(
                    "CHAT INITIALIZATION ERROR:",
                    error
                );


                setStatus(
                    "Connection failed",
                    false
                );


                alert(
                    "Could not open this chat."
                );


                window.location.href =
                    "index.html";

            }

        }


        // ==========================================
        // SEND MESSAGE
        // ==========================================

        messageForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const text =
                    messageInput.value.trim();


                if (!text) {
                    return;
                }


                if (!currentUser) {

                    alert(
                        "Chat is not connected yet."
                    );

                    return;

                }


                try {

                    /*
                     * Make sure our membership still exists
                     * before sending.
                     */

                    const userSnapshot =
                        await get(userRef);


                    if (!userSnapshot.exists()) {

                        /*
                         * Restore membership if it was
                         * somehow removed.
                         */

                        await set(
                            userRef,
                            true
                        );

                    }


                    // Create message

                    const newMessage =
                        push(
                            messagesRef
                        );


                    await set(
                        newMessage,
                        {

                            userId:
                                currentUser.uid,

                            text:
                                text,

                            createdAt:
                                Date.now()

                        }
                    );


                    messageInput.value = "";

                    messageInput.focus();


                } catch (error) {

                    console.error(
                        "SEND MESSAGE ERROR:",
                        error
                    );


                    alert(
                        "Message could not be sent."
                    );

                }

            }
        );


        // ==========================================
        // COPY ROOM CODE
        // ==========================================

        copyCodeButton.addEventListener(
            "click",
            async () => {

                try {

                    await navigator.clipboard.writeText(
                        roomCode
                    );


                    const originalText =
                        copyCodeButton.textContent;


                    copyCodeButton.textContent =
                        "Copied!";


                    setTimeout(
                        () => {

                            copyCodeButton.textContent =
                                originalText;

                        },
                        1500
                    );


                } catch (error) {

                    console.error(
                        "COPY ERROR:",
                        error
                    );

                }

            }
        );


        // ==========================================
        // LEAVE CHAT
        // ==========================================

        leaveButton.addEventListener(
            "click",
            async () => {

                if (leaving) {
                    return;
                }


                const confirmed =
                    confirm(
                        "Leave this chat?"
                    );


                if (!confirmed) {
                    return;
                }


                leaving = true;


                try {

                    if (userRef) {

                        await remove(
                            userRef
                        );

                    }


                    sessionStorage.removeItem(
                        "tempChatUser"
                    );

                    sessionStorage.removeItem(
                        "tempChatRoom"
                    );


                    window.location.href =
                        "index.html";


                } catch (error) {

                    console.error(
                        "LEAVE ERROR:",
                        error
                    );


                    window.location.href =
                        "index.html";

                }

            }
        );


        // ==========================================
        // START
        // ==========================================

        initializeChat();

    </script>

</body>

</html>
